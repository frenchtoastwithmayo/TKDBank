<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TKD Bank</title>
  <meta name="description" content="Centralized Taekwondo training library. Patterns, sparring, and techniques in one place." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Navigation -->
  <nav class="nav">
    <a href="#" class="nav-brand" data-nav="home">
      <div class="logo">TKD</div>
      <span>TKD Bank</span>
    </a>

    <div class="nav-links">
      <a href="#" data-nav="home">Home</a>
      <a href="#" data-nav="patterns">Patterns</a>
      <a href="#" data-nav="sparring">Sparring</a>
      <a href="#" data-nav="resources">Resources</a>
      <button class="nav-search-btn" id="nav-search" aria-label="Search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      </button>
    </div>

    <button class="mobile-menu-btn" id="menu-btn" aria-label="Menu">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
    </button>
  </nav>

  <!-- Mobile Nav -->
  <div class="mobile-nav" id="mobile-nav">
    <a href="#" data-nav="home">Home</a>
    <a href="#" data-nav="patterns">Patterns</a>
    <a href="#" data-nav="sparring">Sparring</a>
    <a href="#" data-nav="resources">Resources</a>
    <a href="#" data-nav="search">Search</a>
  </div>

  <!-- Main App -->
  <main id="app"></main>

  <!-- Footer -->
  <footer class="footer">
    <div class="brand">TKD BANK</div>
    <div class="tagline">Your Training. Your Progress. Your Library.</div>
  </footer>

  <!-- Video / Resource Modal -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <button class="modal-close" id="modal-close" aria-label="Close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
      <div id="modal-body"></div>
    </div>
  </div>

  <script src="data/resources.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
